[package]
name = "payments_engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "sync"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[profile.release]
overflow-checks = true

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["macros", "time"] }
